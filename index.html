function renderHistory() {
  clearTimeout(clearHistoryTimer);
  clearHistoryPending = false;

  const main    = document.getElementById('main');
  const history = appState.history || [];
  const players = appState.players || [];

  let h = '<div class="view-content">';

  // Header row with export + reset buttons
  h += `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;margin-bottom:1.5rem">
    <div class="phase-tag" style="margin-bottom:0">◆ CHRONICLE</div>
    <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
      <button class="btn small" onclick="handleExportHistory()" ${history.length === 0 ? 'disabled' : ''}>📥 Export</button>
      <button class="btn danger small" id="clear-history-btn" onclick="handleClearHistory()" ${history.length === 0 ? 'disabled' : ''}>Reset History</button>
    </div>
  </div>`;

  if (history.length === 0) {
    h += '<p class="notice">No rolls yet.</p>';
    h += '</div>';
    main.innerHTML = h;
    return;
  }

  // ---- Build stats ----
  const playerStats = {};
  for (const p of players) {
    playerStats[p.id] = { name: p.name, cls: Object.keys(p.specs || {})[0] || '', TANK: 0, HEAL: 0, DPS: 0, total: 0 };
  }
  for (const roll of history) {
    for (const a of (roll.assignments || [])) {
      if (!playerStats[a.playerId]) {
        playerStats[a.playerId] = { name: a.playerName, cls: a.class || '', TANK: 0, HEAL: 0, DPS: 0, total: 0 };
      }
      playerStats[a.playerId][a.role] = (playerStats[a.playerId][a.role] || 0) + 1;
      playerStats[a.playerId].total++;
      if (!playerStats[a.playerId].cls) playerStats[a.playerId].cls = a.class || '';
    }
  }

  // Hero stats computations
  const nights = new Set(history.map(r => r.rolledAt ? r.rolledAt.slice(0, 10) : '')).size;
  const dungeonTally = {};
  for (const roll of history) {
    if (roll.dungeon) dungeonTally[roll.dungeon] = (dungeonTally[roll.dungeon] || 0) + 1;
  }
  const topDungeonEntry = Object.entries(dungeonTally).sort((a, b) => b[1] - a[1])[0];
  const topDungeon  = topDungeonEntry ? topDungeonEntry[0] : null;
  const topDungeonN = topDungeonEntry ? topDungeonEntry[1] : 0;

  const withRolls = Object.values(playerStats).filter(s => s.total > 0);
  const topTank = withRolls.slice().sort((a, b) => b.TANK - a.TANK)[0];
  const topHeal = withRolls.slice().sort((a, b) => b.HEAL - a.HEAL)[0];

  // ---- Hero stats row ----
  h += '<div class="hero-stats-row">';
  // Card 1: Total rolls
  h += `<div class="hero-stat-card">
    <div class="hero-stat-label">TOTAL ROLLS</div>
    <div class="hero-stat-value">${history.length}</div>
    <div class="hero-stat-caption">over ${nights} night${nights !== 1 ? 's' : ''}</div>
  </div>`;
  // Card 2: Most rolled dungeon
  if (topDungeon) {
    h += `<div class="hero-stat-card">
      <div class="hero-stat-label">MOST ROLLED</div>
      <div class="hero-stat-value" style="font-size:1.1rem;color:var(--gold)">${esc(topDungeon)}</div>
      <div class="hero-stat-caption">${topDungeonN} time${topDungeonN !== 1 ? 's' : ''}</div>
    </div>`;
  }
  // Card 3: Top tank
  if (topTank && topTank.TANK > 0) {
    const cc = classColor(topTank.cls);
    h += `<div class="hero-stat-card">
      <div class="hero-stat-label">TOP TANK</div>
      <div class="hero-stat-value" style="font-size:1.1rem;color:${cc}">${esc(topTank.name)}</div>
      <div class="hero-stat-caption">${topTank.TANK} of ${topTank.total} rolls</div>
    </div>`;
  }
  // Card 4: Top heal
  if (topHeal && topHeal.HEAL > 0) {
    const cc = classColor(topHeal.cls);
    h += `<div class="hero-stat-card">
      <div class="hero-stat-label">TOP HEAL</div>
      <div class="hero-stat-value" style="font-size:1.1rem;color:${cc}">${esc(topHeal.name)}</div>
      <div class="hero-stat-caption">${topHeal.HEAL} of ${topHeal.total} rolls</div>
    </div>`;
  }
  h += '</div>';

  // ---- Two-column body: role dist + dungeon dist ----
  h += '<div class="chronicle-body">';

  // Left: role distribution (stacked bars)
  const activeStat = withRolls.sort((a, b) => b.total - a.total);
  if (activeStat.length > 0) {
    h += '<div class="chronicle-left">';
    h += '<div class="chronicle-col-label">ROLE DISTRIBUTION</div>';
    for (const s of activeStat) {
      const total = s.total || 1;
      const tw = Math.round((s.TANK / total) * 100);
      const hw = Math.round((s.HEAL / total) * 100);
      const dw = 100 - tw - hw;
      const cc = classColor(s.cls);
      h += `<div class="role-dist-card">
        <div class="role-dist-player">
          ${playerAvatar(24, s.name, s.cls)}
          <div class="role-dist-name" style="color:${cc};margin-top:4px">${esc(s.name)}</div>
        </div>
        <div class="stacked-bar-wrap">
          <div class="stacked-bar">
            <div class="stacked-bar__seg" style="width:${tw}%;background:${ROLE_COLORS.TANK}"></div>
            <div class="stacked-bar__seg" style="width:${hw}%;background:${ROLE_COLORS.HEAL}"></div>
            <div class="stacked-bar__seg" style="width:${dw}%;background:${ROLE_COLORS.DPS}"></div>
          </div>
        </div>
        <div class="role-dist-counts">T·${s.TANK}&nbsp;&nbsp;H·${s.HEAL}&nbsp;&nbsp;D·${s.DPS}</div>
      </div>`;
    }
    h += '</div>';
  }

  // Right: dungeon distribution
  const dungeonCounts = Object.keys(DUNGEON_CODES).map(d => ({
    name: d, code: DUNGEON_CODES[d], count: history.filter(r => r.dungeon === d).length,
  })).sort((a, b) => b.count - a.count);
  const maxCount = Math.max(...dungeonCounts.map(d => d.count), 1);

  h += '<div class="chronicle-right">';
  h += '<div class="chronicle-col-label">DUNGEON DISTRIBUTION</div>';
  for (const d of dungeonCounts) {
    const barW = Math.round((d.count / maxCount) * 100);
    h += `<div class="dung-dist-row">
      <span class="dung-code-pill">${esc(d.code)}</span>
      <span class="dung-dist-name">${esc(d.name)}</span>
      <div class="dung-bar-track"><div class="dung-bar-fill" style="width:${barW}%"></div></div>
      <span class="dung-dist-count">${d.count}</span>
    </div>`;
  }
  h += '</div>';

  h += '</div>'; // chronicle-body

  // ---- Recent rolls ----
  const recent = history.slice(0, 30);
  h += `<div style="margin-top:24px">
    <div class="chronicle-col-label">RECENT ROLLS</div>
    <div class="roll-list">`;
  for (const roll of recent) {
    const date    = new Date(roll.rolledAt).toLocaleString('de-DE', { timeZone: 'Europe/Berlin' });
    const keyInfo = roll.keyLevel != null ? ` +${roll.keyLevel}` : '';
    h += `<div class="roll-entry">
      <div class="roll-header">
        <span class="roll-date">${esc(date)}</span>
        <span class="roll-dungeon">${keyInfo ? esc(keyInfo) + ' ' : ''}${esc(roll.dungeon || '—')}</span>
        <button class="btn small danger" id="del-btn-${esc(roll.id)}" onclick="handleDeleteRoll('${esc(roll.id)}')">${deleteRollConfirmId === roll.id ? 'Confirm delete?' : 'Delete'}</button>
      </div>
      <div class="roll-assignments">`;
    for (const a of (roll.assignments || [])) {
      h += `<div class="roll-assign">
        ${roleBadge(a.role)}
        <span style="color:${classColor(a.class)}">${esc(a.playerName)}</span>
        <span class="roll-spec">${esc(a.spec)} ${esc(a.class)}</span>
      </div>`;
    }
    h += '</div></div>';
  }
  h += '</div></div>';

  h += '</div>';
  main.innerHTML = h;
}

// ==================== EVENT HANDLERS ====================

// ---- Randomize ----

function togglePlayer(id) {
  if (rPhase !== 'idle') return;
  if (!activePlayers.has(id) && activePlayers.size >= 5) return;
  activePlayers.has(id) ? activePlayers.delete(id) : activePlayers.add(id);
  sessionStorage.setItem('wow_active', JSON.stringify([...activePlayers]));
  render();
}

function clearActivePlayers() {
  if (rPhase !== 'idle') return;
  activePlayers.clear();
  sessionStorage.removeItem('wow_active');
  render();
}

function handleRandomize() {
  if (isAnimating || activePlayers.size !== 5) return;

  let assignments, errors, attempts = 0;
  do {
    ({ assignments, errors } = computeAssignments([...activePlayers]));
    attempts++;
  } while (errors.length > 0 && attempts < 100);

  if (errors.length > 0) {
    showInlineError('No valid assignment found — make sure at least one selected player has Tank specs and one has Heal specs enabled.');
    return;
  }

  const roleOrder = { TANK: 0, HEAL: 1, DPS: 2 };
  rAssignments = assignments.sort((a, b) => roleOrder[a.role] - roleOrder[b.role]);
  rPhase       = 'revealing';
  render();
  runRevealAnimation(assignments);
}

async function runRevealAnimation(assignments) {
  isAnimating = true;
  skipReveal  = false;
  const names = [...activePlayers]
    .map(id => appState.players.find(p => p.id === id)?.name)
    .filter(Boolean);
  if (names.length === 0) names.push(...appState.players.map(p => p.name));

  await sleep(200);

  for (let i = 0; i < assignments.length; i++) {
    const a        = assignments[i];
    const cycleEl  = document.getElementById(`slot-player-${i}`);
    const detailEl = document.getElementById(`slot-detail-${i}`);
    if (!cycleEl) continue;

    if (!skipReveal) {
      for (let c = 0; c < 12; c++) {
        cycleEl.textContent = pick(names);
        playClick();
        await sleep(80);
        if (skipReveal) break;
      }
    }

    // Settle this card
    const cc         = classColor(a.class);
    const portraitEl = document.getElementById(`slot-portrait-${i}`);
    const nameEl     = document.getElementById(`slot-name-${i}`);
    const cardEl     = document.getElementById(`slot-card-${i}`);

    if (portraitEl) {
      portraitEl.classList.add('slot-portrait--settled');
      portraitEl.style.background = `radial-gradient(ellipse at center, ${cc}44, ${cc}11)`;
      portraitEl.innerHTML = playerAvatar(70, a.playerName, a.class);
    }
    if (nameEl) {
      nameEl.innerHTML = `<span style="color:${cc}">${esc(a.playerName)}</span>`;
    }
    if (detailEl) detailEl.textContent = `${a.spec} ${a.class}`;
    if (cardEl) {
      cardEl.classList.add('slot-card--settling');
      cardEl.style.borderColor = cc;
      cardEl.style.boxShadow   = `0 0 24px ${cc}40`;
    }

    // Update progress line
    const settled = i + 1;
    const prog = document.getElementById('reveal-progress');
    if (prog) prog.textContent = `${settled} OF 5 BOUND · ${5 - settled} STILL WRITHING`;

    if (!skipReveal) {
      playSettle();
      await sleep(300);
    }
  }

  if (!skipReveal) await sleep(500);
  isAnimating = false;
  const skipBtn    = document.getElementById('skip-btn-el');
  const advanceBtn = document.getElementById('advance-btn-el');
  if (skipBtn)    { skipBtn.disabled = true; skipBtn.style.opacity = '0.35'; skipBtn.style.cursor = 'default'; }
  if (advanceBtn) advanceBtn.disabled   = false;
}

function advanceToKeystones() {
  rPhase = 'key-entry';
  render();
}


function setPlayerDungeon(playerId, dungeon) {
  const ki = rKeyInputs[playerId] || { dungeon: null, level: 10 };
  // Toggle off if same dungeon clicked again
  rKeyInputs[playerId] = { ...ki, dungeon: ki.dungeon === dungeon ? null : dungeon };
  render();
}

function setPlayerLevel(playerId, delta) {
  const ki = rKeyInputs[playerId];
  if (!ki || !ki.dungeon) return;
  const newLevel = Math.max(2, (ki.level || 8) + delta);
  rKeyInputs[playerId] = { ...ki, level: newLevel };
  render();
}

function handleRollKey() {
  // Build weighted pool: one entry per player who has a dungeon selected
  const pool = [];
  for (const a of rAssignments) {
    const ki = rKeyInputs[a.playerId];
    if (ki && ki.dungeon) {
      pool.push({ dungeon: ki.dungeon, level: ki.level || 8, playerName: a.playerName });
    }
  }

  let dungeon, keyHolder = null, keyLevel = null;
  if (pool.length === 0) {
    dungeon = pick(SEASON_DUNGEONS);
  } else {
    const chosen = pick(pool);
    dungeon   = chosen.dungeon;
    keyHolder = chosen.playerName;
    keyLevel  = chosen.level;
  }

  rDungeon   = dungeon;
  rKeyPool   = [...new Set(pool.map(p => p.dungeon))];
  rKeyHolder = keyHolder;
  rKeyLevel  = keyLevel;
  runDungeonReveal(dungeon, keyHolder, keyLevel);
}

async function runDungeonReveal(dungeon, keyHolder, keyLevel) {
  isAnimating  = true;
  rPhase       = 'done';
  rDungeon     = '';
  render();

  const displayEl = document.getElementById('dungeon-name-display');
  if (displayEl) {
    displayEl.textContent = '???';
    for (let c = 0; c < 8; c++) {
      displayEl.textContent = pick(SEASON_DUNGEONS);
      playClick();
      await sleep(100);
    }
    displayEl.textContent = dungeon;
    displayEl.classList.add('glow');
    playFanfare();
  }

  rDungeon    = dungeon;
  isAnimating = false;

  // Inject dungeon art now that the dungeon is known (initial render had rDungeon='')
  const artEl = document.getElementById('dungeon-art-el');
  const img   = DUNGEON_IMAGES[dungeon];
  if (artEl && img) {
    artEl.className = 'dungeon-art';
    artEl.innerHTML = `<img src="${img}" alt="${esc(dungeon)}" loading="lazy">`;
  }

  // Persist to history
  const roll = {
    id:          'roll-' + genId(),
    rolledAt:    new Date().toISOString(),
    assignments: rAssignments,
    dungeon,
    keyPool:     rKeyPool,
    keyLevel:    keyLevel  ?? null,
    keyHolder:   keyHolder ?? null,
  };
  appState.history = [roll, ...(appState.history || [])].slice(0, 200);

  saveState().catch(e => {
    console.error('History save failed:', e);
    showInlineError('⚠️ Failed to save roll to server — it won\'t appear in History.');
  });
}

function resetRandomize() {
  rPhase       = 'idle';
  rAssignments = [];
  rDungeon     = '';
  rKeyPool     = [];
  rKeyInputs   = {};
  rKeyHolder   = null;
  rKeyLevel    = null;
  render();
}

async function copyResult() {
  const roleEmoji = { TANK: '🛡', HEAL: '✚', DPS: '⚔' };
  const keyLine = rKeyLevel != null
    ? `🎲 Tonight: +${rKeyLevel} ${rDungeon}${rKeyHolder ? ` (${rKeyHolder}'s key)` : ''}`
    : `🎲 Tonight: ${rDungeon}`;
  const comp = computeComp(rAssignments);
  const compParts = [
    `⚡ ${comp.interrupts} interrupts`,
    comp.lust  ? `🩸 Lust` : null,
    comp.brez.length ? `♻️ BRez` : null,
  ].filter(Boolean);
  const lines = [
    keyLine,
    ...rAssignments.map(a =>
      `${roleEmoji[a.role] || '▪️'} ${ROLE_LABELS[a.role]}: ${a.playerName} — ${a.spec} ${a.class}`
    ),
    ...(compParts.length ? [compParts.join(' · ')] : []),
  ];
  try {
    await navigator.clipboard.writeText(lines.join('\n'));
    const btn = document.getElementById('copy-result-btn');
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = '✓ Copied!';
      setTimeout(() => { btn.textContent = orig; }, 2000);
    }
  } catch {
    showInlineError('Clipboard unavailable — copy manually:\n' + lines.join('\n'));
  }
}

// ---- Setup ----

async function handleAddPlayer() {
  const nameEl  = document.getElementById('new-name');
  const errEl   = document.getElementById('add-err');
  const name    = nameEl ? nameEl.value.trim() : '';

  if (!name)          return setFieldErr(errEl, 'Name is required.');
  if (name.length>30) return setFieldErr(errEl, 'Name must be 30 characters or fewer.');
  if (appState.players.some(p => p.name.toLowerCase() === name.toLowerCase()))
    return setFieldErr(errEl, 'A player with that name already exists.');

  const specs = {};
  document.querySelectorAll('.new-spec:checked').forEach(cb => {
    const cls = cb.dataset.class;
    if (!specs[cls]) specs[cls] = [];
    specs[cls].push(cb.value);
  });
  if (Object.keys(specs).length === 0) return setFieldErr(errEl, 'Select at least one spec.');

  const newPlayer = { id: genId(), name, specs };
  appState.players = [...appState.players, newPlayer];

  try {
    await saveState();
    setupSelectedPlayerId = newPlayer.id;
    setupAddingClass      = false;
    renderSetup();
    showSaved();
  } catch (e) {
    appState.players = appState.players.filter(p => p.id !== newPlayer.id);
    setFieldErr(errEl, 'Failed to save: ' + e.message);
  }
}

function selectSetupPlayer(id) {
  setupSelectedPlayerId = id;
  setupAddingClass      = false;
  clearTimeout(removeConfirmTimer);
  removeConfirmId = null;
  renderSetup();
}

async function toggleSpec(playerId, cls, spec) {
  const player = appState.players.find(p => p.id === playerId);
  if (!player) return;

  const old       = appState.players;
  const curSpecs  = (player.specs[cls] || []).slice();
  const isOn      = curSpecs.includes(spec);
  let newSpecs;
  if (isOn) {
    newSpecs = curSpecs.filter(s => s !== spec);
  } else {
    newSpecs = [...curSpecs, spec];
  }

  const updatedPlayerSpecs = { ...player.specs };
  if (newSpecs.length === 0) {
    delete updatedPlayerSpecs[cls];
  } else {
    updatedPlayerSpecs[cls] = newSpecs;
  }

  if (Object.keys(updatedPlayerSpecs).length === 0) {
    showInlineError('At least one spec must remain enabled.');
    return;
  }

  appState.players = old.map(p =>
    p.id === playerId ? { ...p, specs: updatedPlayerSpecs } : p
  );
  try {
    await saveState();
    renderSetup();
    showSaved();
  } catch (e) {
    appState.players = old;
    showInlineError('Failed to save: ' + e.message);
  }
}

async function addClassToPlayer(playerId, cls) {
  const player = appState.players.find(p => p.id === playerId);
  if (!player || player.specs[cls]) return;

  const old = appState.players;
  const allSpecsForClass = (CLASSES[cls] || []).map(s => s.spec);
  const updatedSpecs = { ...player.specs, [cls]: allSpecsForClass };

  appState.players = old.map(p =>
    p.id === playerId ? { ...p, specs: updatedSpecs } : p
  );
  setupAddingClass = false;
  try {
    await saveState();
    renderSetup();
    showSaved();
  } catch (e) {
    appState.players = old;
    setupAddingClass = false;
    showInlineError('Failed to save: ' + e.message);
  }
}

async function handleSavePlayerName(id) {
  const nameEl = document.getElementById(`roster-name-${id}`);
  if (!nameEl) return;
  const name = nameEl.value.trim();
  const player = appState.players.find(p => p.id === id);
  if (!player || name === player.name) return;

  if (!name || name.length > 30) {
    nameEl.value = player.name;
    showInlineError(name ? 'Name must be 30 characters or fewer.' : 'Name is required.');
    return;
  }
  if (appState.players.some(p => p.id !== id && p.name.toLowerCase() === name.toLowerCase())) {
    nameEl.value = player.name;
    showInlineError('A player with that name already exists.');
    return;
  }

  const old = appState.players;
  appState.players = old.map(p => p.id === id ? { ...p, name } : p);
  try {
    await saveState();
    renderSetup();
    showSaved();
  } catch (e) {
    appState.players = old;
    showInlineError('Failed to save: ' + e.message);
  }
}

async function handleRemovePlayer(id) {
  if (removeConfirmId !== id) {
    removeConfirmId = id;
    clearTimeout(removeConfirmTimer);
    removeConfirmTimer = setTimeout(() => {
      removeConfirmId = null;
      const btn = document.getElementById(`remove-btn-${id}`);
      if (btn) btn.textContent = 'Remove';
    }, 3000);
    renderSetup();
    return;
  }

  clearTimeout(removeConfirmTimer);
  removeConfirmId = null;

  const old = appState.players;
  appState.players = old.filter(p => p.id !== id);
  activePlayers.delete(id);
  setupSelectedPlayerId = null;

  try {
    await saveState();
    renderSetup();
  } catch (e) {
    appState.players = old;
    activePlayers.add(id);
    showInlineError('Failed to remove player: ' + e.message);
  }
}

// ---- History ----

async function handleClearHistory() {
  const btn = document.getElementById('clear-history-btn');
  if (!clearHistoryPending) {
    clearHistoryPending = true;
    if (btn) btn.textContent = 'Confirm wipe?';
    clearHistoryTimer = setTimeout(() => {
      clearHistoryPending = false;
      if (btn) btn.textContent = 'Reset History';
    }, 3000);
    return;
  }
  clearTimeout(clearHistoryTimer);
  clearHistoryPending = false;
  const old = appState.history;
  appState.history = [];
  try {
    await saveState();
    renderHistory();
  } catch (e) {
    appState.history = old;
    showInlineError('Failed to clear history: ' + e.message);
  }
}

async function handleExportHistory() {
  try {
    const res = await apiRequest('GET');
    if (!res.ok) throw new Error(`Server error (${res.status})`);
    const data = await res.json();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `wow-mplus-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    showInlineError('Export failed: ' + e.message);
  }
}

function handleClsAll(cb) {
  const container = cb.closest('.spec-group');
  if (!container) return;
  container.querySelectorAll('.new-spec, .edit-spec').forEach(s => s.checked = cb.checked);
}

async function handleDeleteRoll(id) {
  if (deleteRollConfirmId !== id) {
    deleteRollConfirmId = id;
    clearTimeout(deleteRollTimer);
    deleteRollTimer = setTimeout(() => {
      deleteRollConfirmId = null;
      const btn = document.getElementById(`del-btn-${id}`);
      if (btn) btn.textContent = 'Delete';
    }, 3000);
    const btn = document.getElementById(`del-btn-${id}`);
    if (btn) btn.textContent = 'Confirm delete?';
    return;
  }

  clearTimeout(deleteRollTimer);
  deleteRollConfirmId = null;

  const old = appState.history;
  appState.history = old.filter(r => r.id !== id);
  try {
    await saveState();
    renderHistory();
  } catch (e) {
    appState.history = old;
    showInlineError('Failed to delete roll: ' + e.message);
  }
}

// ---- Helpers ----

function setFieldErr(el, msg) {
  if (!el) return;
  el.textContent = msg;
  el.hidden = false;
}

function showSaved() {
  const el = document.createElement('div');
  el.className = 'save-indicator';
  el.textContent = '✓ Saved';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

function showInlineError(msg) {
  const main = document.getElementById('main');
  if (!main) return;
  const el = document.createElement('div');
  el.className = 'inline-error';
  el.textContent = msg;
  main.prepend(el);
  setTimeout(() => el.remove(), 6000);
}

// ==================== MUTE BUTTON ====================

function updateMuteBtn() {
  const btn = document.getElementById('mute-btn');
  if (btn) btn.textContent = muted ? '🔇' : '🔊';
}

// ==================== MIGRATION ====================

function migratePlayers(state) {
  for (const p of state.players) {
    if (!p.specs && p.classes) {
      p.specs = {};
      for (const cls of p.classes) {
        if (CLASSES[cls]) p.specs[cls] = CLASSES[cls].map(s => s.spec);
      }
      delete p.classes;
    }
  }
}

// ==================== BOOT ====================

function restoreActivePlayers() {
  try {
    const saved = JSON.parse(sessionStorage.getItem('wow_active') || '[]');
    activePlayers = new Set(saved.filter(id => appState.players.some(p => p.id === id)));
  } catch {
    activePlayers = new Set();
  }
}

async function boot() {
  updateMuteBtn();

  updateSeasonPill();

  // Render footer from constant so it stays in sync when CURRENT_SEASON changes
  const footer = document.querySelector('footer');
  if (footer) footer.innerHTML = esc(CURRENT_SEASON);

  // Pre-warm AudioContext on first user gesture to avoid Safari iOS silence
  document.addEventListener('click', function primeAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true });

  document.getElementById('mute-btn').addEventListener('click', () => {
    muted = !muted;
    sessionStorage.setItem('wow_muted', String(muted));
    updateMuteBtn();
  });

  document.getElementById('nav').addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (btn && btn.dataset.view) showView(btn.dataset.view);
  });

  document.getElementById('pw-form').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('pw-error');
    errEl.hidden = true;
    sessionPw = document.getElementById('pw-input').value;

    try {
      await loadState();
      restoreActivePlayers();
      sessionStorage.setItem('wow_pw', sessionPw);
      document.getElementById('pw-overlay').hidden = true;
      document.getElementById('app').hidden = false;
      render();
    } catch (err) {
      if (err.status === 401) {
        errEl.textContent = 'Incorrect password.';
        sessionStorage.removeItem('wow_pw');
        sessionPw = '';
      } else {
        errEl.textContent = 'Connection error — check your internet and try again.';
      }
      errEl.hidden = false;
    }
  });

  // Auto-login if we have a cached password
  if (sessionPw) {
    try {
      await loadState();
      restoreActivePlayers();
      document.getElementById('pw-overlay').hidden = true;
      document.getElementById('app').hidden = false;
      render();
    } catch (err) {
      sessionStorage.removeItem('wow_pw');
      sessionPw = '';
      if (err.status !== 401) {
        const errEl = document.getElementById('pw-error');
        errEl.textContent = 'Connection error — enter your password and try again.';
        errEl.hidden = false;
      }
    }
  }
}

// ==================== ZERO 2 HERO ====================

function z2hAllSpecs() {
  const list = [];
  for (const [cls, specs] of Object.entries(CLASSES)) {
    for (const { spec, role } of specs) {
      list.push({ class: cls, spec, role });
    }
  }
  return list;
}

function z2hTogglePlayer(id) {
  if (z2hSelected.has(id)) {
    z2hSelected.delete(id);
  } else if (z2hSelected.size < 5) {
    z2hSelected.add(id);
  }
  render();
}

function z2hToggleBan(idx) {
  const s = z2hAllSpecs()[idx];
  if (!s) return;
  const existing = z2hCurrentBans.findIndex(b => b.class === s.class && b.spec === s.spec);
  if (existing >= 0) {
    z2hCurrentBans.splice(existing, 1);
  } else if (z2hCurrentBans.length < 5) {
    z2hCurrentBans.push({ class: s.class, spec: s.spec });
  }
  render();
}

function z2hLockBans() {
  z2hPlayers[z2hCurrentBanner].bans = [...z2hCurrentBans];
  z2hCurrentBans = [];
  z2hCurrentBanner++;
  if (z2hCurrentBanner === 5) z2hPhase = 'ready';
  render();
}

function z2hBeginOath() {
  z2hPlayers = appState.players
    .filter(p => z2hSelected.has(p.id))
    .map(p => ({ id: p.id, name: p.name, bans: [] }));
  z2hCurrentBanner = 0;
  z2hCurrentBans = [];
  z2hPhase = 'banning';
  render();
}

function resetZ2H() {
  z2hPhase = 'idle';
  z2hSelected = new Set();
  z2hPlayers = [];
  z2hCurrentBanner = 0;
  z2hCurrentBans = [];
  z2hAssignments = [];
  z2hIsAnimating = false;
  z2hSkipReveal = false;
  z2hRerolls = {};
  render();
}

function renderZ2H() {
  if      (z2hPhase === 'idle')                                 renderZ2HIdle();
  else if (z2hPhase === 'banning')                              renderZ2HBanning();
  else if (z2hPhase === 'ready')                                renderZ2HReady();
  else if (z2hPhase === 'revealing' || z2hPhase === 'done')     renderZ2HReveal();
}

function renderZ2HIdle() {
  const main    = document.getElementById('main');
  const players = appState.players;
  const capped  = z2hSelected.size >= 5;
  let h = '<div class="section">';
  h += '<div style="text-align:center;margin-bottom:32px">';
  h += '<div style="font-family:var(--font-display);font-size:2.2rem;font-weight:700;letter-spacing:0.12em;color:var(--keystone);margin-bottom:8px">ZERO 2 HERO</div>';
  h += '<div style="color:var(--text-dim);font-size:0.95rem">Five adventurers. New characters. Level 90. 3000 Rio.</div>';
  h += '<div style="color:var(--text-mute);font-size:0.82rem;margin-top:6px;font-family:var(--font-mono)">Each player bans up to 5 specs · Fate assigns the rest</div>';
  h += '</div>';

  if (players.length < 5) {
    h += '<div style="text-align:center;color:var(--text-mute);font-family:var(--font-mono);font-size:0.88rem">Add at least 5 players to the Roster first.</div>';
  } else {
    h += '<div style="font-family:var(--font-mono);font-size:0.75rem;letter-spacing:0.1em;color:var(--text-mute);margin-bottom:10px;text-align:center">SELECT 5 ADVENTURERS</div>';
    h += '<div class="z2h-player-pick">';
    for (const p of players) {
      const sel = z2hSelected.has(p.id);
      const cap = !sel && capped;
      h += `<button class="z2h-player-chip${sel ? ' selected' : ''}${cap ? ' pick-capped' : ''}" onclick="z2hTogglePlayer('${p.id}')">${esc(p.name)}</button>`;
    }
    h += '</div>';
    h += `<div style="font-family:var(--font-mono);font-size:0.78rem;color:var(--text-mute);margin-bottom:24px;text-align:center">${z2hSelected.size} / 5 chosen</div>`;
    h += `<div class="center"><button class="action-primary"${z2hSelected.size < 5 ? ' disabled' : ''} onclick="z2hBeginOath()">⚔ BEGIN THE OATH ⚔</button></div>`;
  }
  h += '</div>';
  main.innerHTML = h;
}

function renderZ2HBanning() {
  const main   = document.getElementById('main');
  const p      = z2hPlayers[z2hCurrentBanner];
  const capped = z2hCurrentBans.length >= 5;
  let h = '<div class="section">';

  h += '<div style="display:flex;align-items:baseline;gap:14px;margin-bottom:20px;justify-content:center">';
  h += `<div style="font-family:var(--font-display);font-size:1.4rem;font-weight:700;color:var(--text)">${esc(p.name)}</div>`;
  h += `<div style="font-family:var(--font-mono);font-size:0.72rem;letter-spacing:0.12em;color:var(--text-mute)">PLAYER ${z2hCurrentBanner + 1} OF 5 · BAN UP TO 5 SPECS</div>`;
  h += '</div>';

  h += `<div style="font-family:var(--font-mono);font-size:0.78rem;letter-spacing:0.1em;color:var(--dps);margin-bottom:20px;text-align:center">${z2hCurrentBans.length} / 5 SPECS SEALED</div>`;

  h += '<div class="z2h-class-grid">';
  let specIdx = 0;
  for (const [cls, specs] of Object.entries(CLASSES)) {
    const cc = CLASS_COLORS[cls] || '#cccccc';
    h += `<div class="z2h-class-group" style="border-color:${cc};background:${cc}10">`;
    h += `<div class="z2h-class-header" style="color:${cc}">${esc(cls)}</div>`;
    h += '<div class="z2h-spec-grid">';
    for (const { spec, role } of specs) {
      const isBanned = z2hCurrentBans.some(b => b.class === cls && b.spec === spec);
      const cap      = !isBanned && capped;
      const dot      = `<b style="color:${ROLE_COLORS[role]}">${ROLE_LABELS[role][0]}</b>`;
      h += `<button class="z2h-spec-pill${isBanned ? ' banned' : ''}${cap ? ' ban-capped' : ''}" onclick="z2hToggleBan(${specIdx})">${dot} ${esc(spec)}</button>`;
      specIdx++;
    }
    h += '</div></div>';
  }
  h += '</div>';

  h += '<div style="display:flex;gap:12px;align-items:center;margin-top:28px;justify-content:center">';
  const lockLabel = z2hCurrentBans.length === 0 ? 'Lock In (No Bans)' : `Lock In ${z2hCurrentBans.length} Ban${z2hCurrentBans.length !== 1 ? 's' : ''}`;
  h += `<button class="action-primary" onclick="z2hLockBans()">${lockLabel}</button>`;
  h += `<button class="skip-btn" onclick="resetZ2H()">← Start Over</button>`;
  h += '</div>';

  h += '</div>';
  main.innerHTML = h;
}

function renderZ2HReady() {
  const main = document.getElementById('main');
  let h = '<div class="section">';
  h += '<div style="text-align:center;margin-bottom:28px">';
  h += '<div style="font-family:var(--font-display);font-size:1.5rem;font-weight:700;letter-spacing:0.1em;color:var(--keystone)">THE FIVE HAVE SWORN THEIR OATHS</div>';
  h += '<div style="color:var(--text-mute);font-size:0.82rem;font-family:var(--font-mono);margin-top:6px">All bans are locked in. Destiny awaits.</div>';
  h += '</div>';

  h += '<div style="max-width:480px;margin:0 auto 28px">';
  h += '<ul class="z2h-oath-list" style="margin-bottom:0">';
  for (const p of z2hPlayers) {
    const banText = p.bans.length === 0 ? 'No specs sealed' : `${p.bans.length} spec${p.bans.length !== 1 ? 's' : ''} sealed away`;
    h += `<li class="z2h-oath-item"><span class="z2h-oath-name">${esc(p.name)}</span><span class="z2h-oath-bans">${banText}</span></li>`;
  }
  h += '</ul></div>';

  h += '<div style="display:flex;gap:12px;align-items:center;justify-content:center">';
  h += '<button class="action-primary" onclick="handleZ2HRoll()">⚔ ROLL DESTINY ⚔</button>';
  h += '<button class="skip-btn" onclick="resetZ2H()">← Start Over</button>';
  h += '</div>';

  h += '</div>';
  main.innerHTML = h;
}

function renderZ2HReveal() {
  const isDone = z2hPhase === 'done';
  const main   = document.getElementById('main');
  let h = '<section class="section">';

  h += '<div class="slot-reveal-header"><span></span>';
  h += `<button class="skip-btn" id="z2h-skip-btn"${isDone ? ' disabled style="opacity:0.35;cursor:default"' : ''} onclick="z2hSkipReveal=true">SKIP ▸▸</button>`;
  h += '</div>';

  h += '<div class="slot-cards" role="status" aria-live="polite">';
  for (let i = 0; i < 5; i++) {
    const a  = z2hAssignments[i];
    const cc = classColor(a.class);
    h += `<div class="slot-card" id="z2h-card-${i}"${isDone ? ` style="border-color:${cc};box-shadow:0 0 24px ${cc}40"` : ''}>`;
    h += `<div class="slot-card-role">${roleBadge(a.role)}</div>`;
    if (isDone) {
      h += `<div class="slot-portrait slot-portrait--settled" id="z2h-portrait-${i}" style="background:radial-gradient(ellipse at center,${cc}44,${cc}11)">`;
      h += playerAvatar(70, a.playerName, a.class);
      h += '</div>';
      h += `<div class="slot-name-area" id="z2h-name-${i}"><span style="color:${cc}">${esc(a.playerName)}</span></div>`;
      h += `<div class="slot-spec-line" id="z2h-detail-${i}">${esc(a.spec)} ${esc(a.class)}</div>`;
      if (z2hRerolls.hasOwnProperty(a.playerName)) {
        const orig = z2hRerolls[a.playerName];
        const origCc = classColor(orig.class);
        h += `<div class="z2h-original-line" style="color:${origCc}">was: ${esc(orig.spec)} ${esc(orig.class)}</div>`;
      } else {
        h += `<button class="z2h-reroll-btn" onclick="z2hRerollPlayer(${i})">↺ REROLL</button>`;
      }
    } else {
      h += `<div class="slot-portrait" id="z2h-portrait-${i}"><span class="slot-cycle-name" id="z2h-player-${i}">???</span></div>`;
      h += `<div class="slot-name-area" id="z2h-name-${i}"><span class="slot-dots">· · ·</span></div>`;
      h += `<div class="slot-spec-line" id="z2h-detail-${i}"></div>`;
    }
    h += '</div>';
  }
  h += '</div>';

  h += `<div class="progress-line" id="z2h-progress">${isDone ? 'ALL PATHS ARE SET · YOUR LEGEND BEGINS' : 'THE FATES STIR...'}</div>`;
  h += '<div class="center" style="margin-top:32px">';
  h += `<button class="action-primary" id="z2h-done-btn"${isDone ? '' : ' disabled'} onclick="resetZ2H()">⚔ ROLL AGAIN ⚔</button>`;
  h += '</div>';

  h += '</section>';
  main.innerHTML = h;
}

function computeZ2HAssignments() {
  const allSpecs = z2hAllSpecs();
  const players  = z2hPlayers.map((p) => {
    let eligible = allSpecs.filter(s =>
      !p.bans.some(b => b.class === s.class && b.spec === s.spec)
    );
    if (eligible.length === 0) eligible = allSpecs;
    return { name: p.name, eligible };
  });

  const roles        = shuffle(['TANK', 'HEAL', 'DPS', 'DPS', 'DPS']);
  const shuffledIdxs = shuffle([0, 1, 2, 3, 4]);
  const usedPlayers  = new Set();
  const assignments  = [];

  for (const role of roles) {
    let candidates = shuffledIdxs.filter(
      i => !usedPlayers.has(i) && players[i].eligible.some(s => s.role === role)
    );
    if (candidates.length === 0) candidates = shuffledIdxs.filter(i => !usedPlayers.has(i));
    const chosen = candidates[0];
    usedPlayers.add(chosen);
    const player = players[chosen];
    let pool = player.eligible.filter(s => s.role === role);
    if (pool.length === 0) pool = allSpecs.filter(s => s.role === role);
    const picked = pick(pool);
    assignments.push({ playerName: player.name, role, class: picked.class, spec: picked.spec });
  }

  const order = { TANK: 0, HEAL: 1, DPS: 2 };
  assignments.sort((a, b) => order[a.role] - order[b.role]);
  return assignments;
}

function z2hRerollPlayer(idx) {
  const a = z2hAssignments[idx];
  if (!a || z2hRerolls.hasOwnProperty(a.playerName)) return;
  const original = { ...a };
  z2hRerolls[a.playerName] = original;
  const playerData = z2hPlayers.find(p => p.name === a.playerName);
  const bans = playerData ? playerData.bans : [];
  const allSpecs = z2hAllSpecs();
  let pool = allSpecs.filter(s =>
    s.role === original.role &&
    !bans.some(b => b.class === s.class && b.spec === s.spec) &&
    !(s.class === original.class && s.spec === original.spec)
  );
  if (pool.length === 0) pool = allSpecs.filter(s => s.role === original.role && !(s.class === original.class && s.spec === original.spec));
  if (pool.length === 0) pool = allSpecs.filter(s => s.role === original.role);
  const picked = pick(pool);
  z2hAssignments[idx] = { playerName: original.playerName, role: original.role, class: picked.class, spec: picked.spec };
  render();
}

async function handleZ2HRoll() {
  if (z2hIsAnimating) return;
  z2hAssignments = computeZ2HAssignments();
  z2hPhase = 'revealing';
  render();
  await runZ2HRevealAnimation(z2hAssignments);
}

async function runZ2HRevealAnimation(assignments) {
  z2hIsAnimating = true;
  z2hSkipReveal  = false;
  const names = z2hPlayers.map(p => p.name);

  await sleep(300);

  for (let i = 0; i < assignments.length; i++) {
    const a       = assignments[i];
    const cycleEl = document.getElementById(`z2h-player-${i}`);
    if (!cycleEl) continue;

    if (!z2hSkipReveal) {
      for (let c = 0; c < 30; c++) {
        cycleEl.textContent = pick(names);
        playClick();
        await sleep(120);
        if (z2hSkipReveal) break;
      }
    }

    const cc         = classColor(a.class);
    const portraitEl = document.getElementById(`z2h-portrait-${i}`);
    const nameEl     = document.getElementById(`z2h-name-${i}`);
    const cardEl     = document.getElementById(`z2h-card-${i}`);
    const detailEl   = document.getElementById(`z2h-detail-${i}`);

    if (portraitEl) {
      portraitEl.classList.add('slot-portrait--settled');
      portraitEl.style.background = `radial-gradient(ellipse at center, ${cc}44, ${cc}11)`;
      portraitEl.innerHTML = playerAvatar(70, a.playerName, a.class);
    }
    if (nameEl)   nameEl.innerHTML     = `<span style="color:${cc}">${esc(a.playerName)}</span>`;
    if (detailEl) detailEl.textContent = `${a.spec} ${a.class}`;
    if (cardEl) {
      cardEl.classList.add('z2h-card--settling');
      cardEl.style.borderColor = cc;
      cardEl.style.boxShadow   = `0 0 24px ${cc}40`;
    }

    const prog    = document.getElementById('z2h-progress');
    const settled = i + 1;
    if (prog) {
      prog.textContent = settled < 5
        ? `${settled} OF 5 DESTINIES SEALED · ${5 - settled} STILL UNWRITTEN`
        : 'ALL PATHS ARE SET · YOUR LEGEND BEGINS';
    }

    if (!z2hSkipReveal) {
      playSettle();
      await sleep(800);
    }
  }

  if (!z2hSkipReveal) await sleep(600);
  playFanfare();

  z2hIsAnimating = false;
  z2hPhase       = 'done';

  const skipBtn = document.getElementById('z2h-skip-btn');
  const doneBtn = document.getElementById('z2h-done-btn');
  if (skipBtn) { skipBtn.disabled = true; skipBtn.style.opacity = '0.35'; skipBtn.style.cursor = 'default'; }
  if (doneBtn) doneBtn.disabled = false;
}

boot();
</script>
