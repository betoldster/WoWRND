<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keystone Ritual · Midnight Season 1</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* explicit display values override the browser's [hidden] default — force it back */
#pw-overlay[hidden],
#app[hidden] { display: none !important; }

:root {
  /* Backgrounds */
  --bg:           #0b0916;
  --bg-surface:   #15122a;
  --bg-raised:    #1d1a37;
  /* Aliases for existing CSS that uses --bg2 / --bg3 */
  --bg2:          #15122a;
  --bg3:          #1d1a37;

  /* Borders */
  --border:       #2a2447;
  --border-bright:#3d3566;

  /* Primary accent: keystone purple */
  --keystone:     #a86bff;
  --keystone-dim: #7445c4;
  --keystone-glow:rgba(168,107,255,0.35);

  /* Gold — reserved for dungeon reveal only */
  --gold:         #ffc94d;
  --gold-dim:     #7445c4;  /* repurposed → keystone-dim for old UI elements */
  --gold-glow:    rgba(255,201,77,0.4);

  /* Text */
  --text:         #ece8ff;
  --text-dim:     #8a83b5;
  --text-mute:    #5b5680;

  /* Role colors */
  --tank:         #3b6cd9;
  --heal:         #3cc977;
  --dps:          #e34a4a;
  --danger:       #e34a4a;
  --success:      #3cc977;

  /* Typography */
  --font-display: "Cinzel", Georgia, serif;
  --font-ui:      "Manrope", -apple-system, system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, monospace;
}

html { font-size: 19px; }
@media (min-width: 1280px) { html { font-size: 20px; } }
@media (min-width: 1600px) { html { font-size: 22px; } }
@media (min-width: 1920px) { html { font-size: 24px; } }
body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(168,107,255,0.18), transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 100%, rgba(168,107,255,0.06), transparent 60%);
  color: var(--text);
  font-family: var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  min-height: 100vh;
  font-size: 1rem;
  line-height: 1.55;
}

/* ---- PASSWORD OVERLAY ---- */
#pw-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(168,107,255,0.18), transparent 60%),
    radial-gradient(ellipse 60% 40% at 85% 100%, rgba(168,107,255,0.06), transparent 60%);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
}
.pw-box {
  background: var(--bg-surface);
  border: 1px solid var(--border-bright);
  border-radius: 12px;
  padding: 2.5rem 2rem;
  max-width: 380px;
  width: 92%;
  text-align: center;
  box-shadow: 0 0 40px var(--keystone-glow), 0 4px 16px rgba(0,0,0,0.25);
}
.pw-box h2 { font-family: var(--font-display); color: var(--text); font-size: 1.5rem; margin-bottom: 0.5rem; letter-spacing: 0.1em; }
.pw-box p  { color: var(--text-dim); margin-bottom: 1.5rem; font-family: var(--font-ui); }
#pw-form   { display: flex; flex-direction: column; gap: 0.75rem; }
#pw-input  {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 1rem;
  padding: 0.7rem 1rem;
  width: 100%;
}
#pw-input:focus { outline: none; border-color: var(--keystone-dim); }
#pw-error { color: #e07070; font-size: 0.9rem; padding: 0.5rem 0; }

/* ---- APP SHELL ---- */
#app { display: flex; flex-direction: column; min-height: 100vh; }

header {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  padding: 1.1rem 2.25rem;
  background: rgba(11,9,22,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  flex-wrap: wrap;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.header-wordmark {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.wordmark-text {
  font-family: var(--font-display);
  font-size: 1.55rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  color: var(--text);
  line-height: 1;
}
.season-pill {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  color: var(--text-mute);
  line-height: 1;
  transition: color 0.2s;
}
.season-pill--phase { color: var(--keystone); font-weight: 700; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
.grid-overlay {
  background-image:
    linear-gradient(rgba(168,107,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168,107,255,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.5;
  position: absolute;
  inset: 0;
  pointer-events: none;
}

nav { display: flex; gap: 0.5rem; flex: 1; margin-left: 1rem; }
.tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  padding: 0.7rem 1.4rem;
  border-radius: 0;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tab:hover  { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--keystone); font-weight: 600; }
.tab-glyph  { color: var(--text-mute); font-size: 1rem; transition: color 0.15s; }
.tab.active .tab-glyph { color: var(--keystone); }

.mute-btn {
  background: none;
  border: 1px solid var(--border);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 0;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.15s, background 0.15s;
}
.mute-btn:hover { border-color: var(--border-bright); background: rgba(255,255,255,0.04); }

main { flex: 1; }
footer {
  text-align: center;
  padding: 1rem;
  color: var(--text-dim);
  font-size: 0.8rem;
  border-top: 1px solid var(--border);
  margin-top: 2rem;
}

/* ---- SHARED LAYOUT ---- */
.view-content { max-width: 1600px; margin: 0 auto; padding: 36px 48px; }
.section { margin-bottom: 2.5rem; }
.section-title    { color: var(--text); font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; }
.subsection-title { color: var(--text); font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
.center { text-align: center; }

.notice {
  color: var(--text-dim);
  font-style: italic;
  margin: 0.5rem 0;
  font-size: 0.9rem;
}
.link-btn {
  background: none;
  border: none;
  color: var(--gold);
  cursor: pointer;
  text-decoration: underline;
  font-size: inherit;
  padding: 0;
}
.form-error {
  color: #e07070;
  font-size: 0.85rem;
  margin-top: 0.4rem;
}
.inline-error {
  background: rgba(138,42,42,0.2);
  border: 1px solid #8a2a2a;
  border-radius: 6px;
  color: #e07070;
  padding: 0.7rem 1rem;
  margin-bottom: 1rem;
  font-size: 0.9rem;
}

/* ---- BUTTONS ---- */
.action-primary {
  font-family: var(--font-display);
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  padding: 20px 56px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--keystone-dim), var(--keystone));
  border: none;
  color: #fff;
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.15s;
  box-shadow: 0 0 20px var(--keystone-glow);
}
.action-primary:hover:not(:disabled) { box-shadow: 0 0 32px rgba(168,107,255,0.55); transform: translateY(-1px); }
.action-primary:disabled { opacity: 0.42; cursor: not-allowed; transform: none; box-shadow: none; }

/* Semantic button aliases */
.btn-primary {
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, var(--keystone), var(--keystone-dim));
  color: #fff; border: none;
  padding: 14px 28px; border-radius: 6px;
  font-family: var(--font-display); font-size: 1rem; font-weight: 700; letter-spacing: 0.18em;
  box-shadow: 0 0 18px var(--keystone-glow);
  cursor: pointer;
  transition: box-shadow 0.15s, transform 0.15s;
}
.btn-primary:hover { box-shadow: 0 0 28px rgba(168,107,255,0.5); transform: translateY(-1px); }
.btn-secondary {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: var(--text);
  border: 1px solid var(--border-bright);
  padding: 14px 28px; border-radius: 6px;
  font-family: var(--font-ui); font-size: 1rem; font-weight: 700; letter-spacing: 0.1em;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.btn-secondary:hover { border-color: var(--keystone); background: rgba(168,107,255,0.06); }
.btn-danger {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: var(--danger);
  border: 1px solid rgba(227,74,74,0.33); border-radius: 5px;
  font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600;
  padding: 6px 12px; cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.btn-danger:hover { background: rgba(227,74,74,0.12); border-color: var(--danger); }

.btn {
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.45rem 0.9rem;
  border-radius: 5px;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 0.85rem;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}
.btn:hover         { border-color: var(--border-bright); color: var(--text); }
.btn.danger        { border-color: rgba(227,74,74,0.33); color: #d07070; }
.btn.danger:hover  { background: rgba(227,74,74,0.12); border-color: var(--danger); color: #e09090; }
.btn.small         { padding: 0.3rem 0.65rem; font-size: 0.8rem; }

/* ---- ROLE BADGE ---- */
.role-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: 999px;
  font-family: var(--font-ui);
  font-size: 0.92rem;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.1em;
  flex-shrink: 0;
}
.role-badge--tank { background: linear-gradient(135deg, #3b6cd9, rgba(59,108,217,0.8)); box-shadow: 0 0 0 1px rgba(59,108,217,0.33), 0 2px 6px rgba(59,108,217,0.2); }
.role-badge--heal { background: linear-gradient(135deg, #3cc977, rgba(60,201,119,0.8)); box-shadow: 0 0 0 1px rgba(60,201,119,0.33), 0 2px 6px rgba(60,201,119,0.2); }
.role-badge--dps  { background: linear-gradient(135deg, #e34a4a, rgba(227,74,74,0.8)); box-shadow: 0 0 0 1px rgba(227,74,74,0.33), 0 2px 6px rgba(227,74,74,0.2); }
.role-badge.sm { padding: 5px 11px; font-size: 0.82rem; letter-spacing: 0.08em; }
.role-badge.lg { padding: 10px 18px; font-size: 1.05rem; }

/* ---- CLASS CHIP (legacy inline chip) ---- */
.class-chip {
  font-size: 0.75rem;
  padding: 0.1rem 0.45rem;
  background: rgba(255,255,255,0.05);
  border-radius: 3px;
  white-space: nowrap;
}

/* ---- AVATAR ---- */
.avatar {
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-ui);
  font-weight: 800;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.avatar--22 { width: 30px; height: 30px; font-size: 14px; }
.avatar--24 { width: 32px; height: 32px; font-size: 15px; }
.avatar--28 { width: 38px; height: 38px; font-size: 16px; }
.avatar--32 { width: 42px; height: 42px; font-size: 17px; }
.avatar--36 { width: 48px; height: 48px; font-size: 19px; }
.avatar--40 { width: 54px; height: 54px; font-size: 22px; }
.avatar--48 { width: 64px; height: 64px; font-size: 26px; }
.avatar--70 { width: 96px; height: 96px; font-size: 36px; }

/* ---- CLASS PILL (idle player toggle) ---- */
.class-pill {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 22px 12px 12px;
  border-radius: 999px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  text-align: left;
}
.class-pill:hover:not(.class-pill--on) { border-color: var(--border-bright); }
.class-pill--on { border-color: var(--class-color, var(--keystone)); }
.class-pill__name {
  font-family: var(--font-ui);
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
  display: block;
}
.class-pill__classes {
  font-size: 0.8rem;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  margin-top: 4px;
  display: block;
}

/* ---- SPEC CHIP (setup screen) ---- */
.spec-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 999px;
  font-family: var(--font-ui);
  font-size: 0.95rem;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-mute);
  font-weight: 400;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.spec-chip:hover { border-color: var(--role-color, var(--border-bright)); }
.spec-chip--on {
  background: rgba(var(--role-color-rgb, 168,107,255), 0.125);
  border-color: var(--role-color, var(--keystone));
  color: var(--text);
  font-weight: 600;
}
.spec-chip__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  border: 1px solid var(--text-mute);
  flex-shrink: 0;
}
.spec-chip--on .spec-chip__dot {
  background: var(--role-color, var(--keystone));
  border: none;
}
.spec-chip__role {
  font-size: 0.65rem;
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  margin-left: 2px;
  color: var(--text-mute);
}
.spec-chip--on .spec-chip__role {
  color: var(--role-color, var(--keystone));
}

/* ---- DUNGEON CODE CHIP ---- */
.dungeon-code {
  display: inline-block;
  font-size: 0.9rem;
  font-family: var(--font-mono);
  padding: 6px 12px;
  border-radius: 999px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
  white-space: nowrap;
}
.dungeon-code:hover { border-color: var(--keystone); color: var(--text); }
.dungeon-code--selected {
  background: rgba(168,107,255,0.19);
  border-color: var(--keystone);
  color: var(--text);
  font-weight: 700;
}

/* ---- RITUAL GATHERING (idle phase) ---- */
.ritual-slots-row {
  display: flex;
  gap: 18px;
  margin-bottom: 32px;
}
.ritual-slot {
  flex: 1;
  max-width: 160px;
  aspect-ratio: 1;
  border-radius: 16px;
  border: 2px dashed var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: border-color 0.2s, background 0.2s;
  overflow: hidden;
}
.ritual-slot--filled {
  border-style: solid;
  border-color: var(--keystone);
  background: rgba(168,107,255,0.08);
}
.ritual-slot__q {
  font-family: var(--font-display);
  font-size: 2.25rem;
  color: var(--text-mute);
  line-height: 1;
}
.ritual-slot__name {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  text-align: center;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0 6px;
}
.gather-label {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text-mute);
  letter-spacing: 0.18em;
  margin-bottom: 14px;
}
.class-pills-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 26px;
}
.role-pool-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 28px;
  font-size: 0.95rem;
  color: var(--text-dim);
}
.role-pool-label {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text-mute);
  letter-spacing: 0.2em;
}
.cast-hint {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text-mute);
  letter-spacing: 0.18em;
  margin-top: 14px;
}

/* ---- SLOT CARDS (reveal phase) ---- */
.slot-reveal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.slot-cards {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
.slot-card {
  flex: 1;
  min-height: 340px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  transition: border-color 0.4s, box-shadow 0.4s;
}
.slot-card-role { margin-bottom: 2px; }
.slot-portrait {
  width: 100px;
  height: 100px;
  border-radius: 14px;
  background: var(--bg-raised);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  border: 1px solid var(--border);
  transition: border-color 0.3s, background 0.4s;
}
.slot-portrait--settled { border-color: transparent; }
.slot-cycle-name {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  text-align: center;
  padding: 4px;
}
.slot-name-area {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-align: center;
  min-height: 1.5em;
  transition: color 0.3s;
}
.slot-dots {
  color: var(--text-mute);
  letter-spacing: 4px;
  animation: pulse-dots 1s ease-in-out infinite;
}
@keyframes pulse-dots {
  0%, 100% { opacity: 0.3; }
  50%       { opacity: 1; }
}
.slot-spec-line {
  font-size: 0.9rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
  text-align: center;
  min-height: 1.2em;
}
.skip-btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border-bright);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.skip-btn:hover { border-color: var(--text-dim); color: var(--text); }
.progress-line {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-mute);
  letter-spacing: 0.15em;
  text-align: center;
}
@keyframes card-settle {
  0%   { transform: scale(1.04); }
  60%  { transform: scale(0.98); }
  100% { transform: scale(1); }
}
.slot-card--settling { animation: card-settle 0.28s ease; }

/* ---- PHASE TAG ---- */
.phase-tag {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--keystone);
  letter-spacing: 0.22em;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.phase-tag::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--keystone-glow), transparent);
}

/* ---- PHASE PROGRESS BAR ---- */
.phase-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 2rem;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.1em;
}
.phase-step {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--text-mute);
  white-space: nowrap;
  opacity: 0.5;
}
.phase-step--active {
  color: var(--keystone);
  font-weight: 700;
  opacity: 1;
}
.phase-step--done { opacity: 0.7; }
.phase-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  flex-shrink: 0;
}
.phase-step--active .phase-dot {
  background: var(--keystone);
  border-color: var(--keystone);
  box-shadow: 0 0 6px var(--keystone-glow);
}
.phase-step--done .phase-dot { background: currentColor; }
.phase-divider {
  flex: 1;
  height: 1px;
  background: var(--border);
  max-width: 40px;
}

/* ---- KEYSTONES SCREEN ---- */
.keystones-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 28px;
  align-items: flex-start;
}

.key-player-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
.key-player-row {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left: 3px solid transparent;
  border-radius: 10px;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color 0.15s;
}
.key-player-row.has-key { border-left-color: var(--keystone); border-color: var(--border-bright); }
.key-player-top {
  display: flex;
  align-items: center;
  gap: 12px;
}
.key-player-info { flex: 1; min-width: 0; }
.key-player-name-text { font-size: 1.1rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.key-player-spec-line { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-dim); letter-spacing: 0.04em; white-space: nowrap; display: block; }
.key-dungeons { display: flex; flex-wrap: wrap; gap: 6px; }
.key-level-area {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.key-level-btn {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  color: var(--text-dim);
  width: 30px; height: 30px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 1.05rem;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, color 0.15s;
  flex-shrink: 0;
  user-select: none;
}
.key-level-btn:hover { border-color: var(--keystone); color: var(--text); }
.no-key-label { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-mute); letter-spacing: 0.08em; white-space: nowrap; }
.key-tip {
  font-size: 0.8rem;
  font-family: var(--font-mono);
  color: var(--text-mute);
  letter-spacing: 0.02em;
  padding: 8px 2px;
  line-height: 1.6;
}

/* Odds panel */
.odds-panel {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.odds-header-label {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  font-weight: 700;
  color: var(--text-mute);
  letter-spacing: 0.2em;
}
.odds-count {
  font-size: 1.85rem;
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--text);
  line-height: 1;
}
.odds-count-dim { font-size: 1.05rem; color: var(--text-mute); }
.odds-dungeon-list { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.odds-dungeon-row { display: flex; flex-direction: column; gap: 3px; }
.odds-dungeon-meta { display: flex; justify-content: space-between; align-items: baseline; }
.odds-dungeon-name { font-size: 0.82rem; color: var(--text); }
.odds-dungeon-pct  { font-size: 0.75rem; font-family: var(--font-mono); color: var(--keystone); }
.odds-bar-track { height: 4px; background: var(--bg-raised); border-radius: 2px; overflow: hidden; }
.odds-bar-fill  { height: 100%; background: var(--keystone); border-radius: 2px; transition: width 0.3s ease; }
.odds-empty { font-size: 0.82rem; font-family: var(--font-mono); color: var(--text-mute); }

/* ---- FINAL REVEAL (Tonight's Path) ---- */
.final-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 28px;
  align-items: stretch;
  margin-bottom: 20px;
}
.final-dungeon-card {
  background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg) 100%);
  border: 1px solid var(--gold);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 40px var(--gold-glow);
  display: flex;
  flex-direction: column;
}
.dungeon-art {
  flex: 1;
  min-height: 200px;
  overflow: hidden;
  border-bottom: 1px solid rgba(255,201,77,0.15);
  position: relative;
}
.dungeon-art img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 30%;
  display: block;
}
.dungeon-art-placeholder {
  flex: 1;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px dashed rgba(255,201,77,0.3);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  color: rgba(255,201,77,0.3);
  user-select: none;
}
.dungeon-card-body { padding: 20px 20px 16px; }
.dungeon-reveal-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 16px;
}
.dungeon-name {
  font-family: var(--font-display);
  font-size: 3rem;
  font-weight: 800;
  color: var(--gold);
  letter-spacing: 0.02em;
  text-shadow: 0 0 30px var(--gold-glow);
  min-height: 3rem;
  line-height: 1.1;
}
@keyframes glow-pulse {
  0%   { text-shadow: 0 0 5px rgba(255,201,77,0.2); }
  40%  { text-shadow: 0 0 50px rgba(255,201,77,1), 0 0 100px rgba(255,201,77,0.4); }
  100% { text-shadow: 0 0 30px var(--gold-glow); }
}
.dungeon-name.glow { animation: glow-pulse 0.8s ease forwards; }
.dungeon-bottom-strip {
  border-top: 1px solid rgba(255,201,77,0.18);
  padding-top: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.key-holder-line {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 0.85rem;
  color: var(--text-dim);
}
.affix-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.affix-tag {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--bg-raised);
  border: 1px solid var(--border-bright);
  color: var(--text-dim);
  letter-spacing: 0.05em;
}
.final-party {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.final-party-label {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--text-mute);
  margin-bottom: 4px;
}
.final-party-row {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-radius: 8px;
  padding: 12px 16px;
}
.final-party-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.final-party-name { font-size: 0.95rem; font-weight: 700; line-height: 1.15; }
.final-party-spec { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-dim); }
.final-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: center; margin-top: 14px; }

/* ---- ROSTER (SETUP) ---- */
.roster-layout {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.roster-rail {
  flex: 0 0 260px;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.roster-player-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: 8px;
  border: 1px solid transparent;
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.12s;
}
.roster-player-row:hover { background: var(--bg-surface); }
.roster-player-meta { flex: 1; min-width: 0; }
.roster-player-name { font-size: 0.95rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roster-player-classes { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-dim); margin-top: 2px; }
.roster-player-chevron { color: var(--keystone); font-size: 1.15rem; flex-shrink: 0; line-height: 1; }
.roster-add-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px dashed var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font-ui);
  font-size: 0.85rem;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
  width: 100%;
  text-align: left;
}
.roster-add-btn:hover { border-color: var(--keystone); color: var(--keystone); }
.roster-panel { flex: 1; min-width: 0; }
.roster-panel-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 180px;
  color: var(--text-mute);
  font-family: var(--font-mono);
  font-size: 0.82rem;
  letter-spacing: 0.1em;
  border: 1px dashed var(--border);
  border-radius: 10px;
}
.roster-panel-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.roster-panel-meta { flex: 1; min-width: 0; }
.roster-name-row { display: flex; align-items: center; gap: 8px; }
.roster-panel-name-input {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 700;
  padding: 0.3rem 0.6rem;
  min-width: 0;
  flex: 1;
  max-width: 260px;
  transition: border-color 0.15s;
}
.roster-panel-name-input:focus { outline: none; border-color: var(--keystone-dim); }
.roster-panel-spec-count { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-mute); letter-spacing: 0.08em; margin-top: 4px; }
.class-card {
  border-radius: 8px;
  border-left: 3px solid var(--border);
  background: var(--bg-raised);
  padding: 10px 14px;
  margin-bottom: 8px;
}
.class-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.class-card-name { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
.class-card-right { display: flex; align-items: center; gap: 8px; }
.class-card-counter { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-mute); }
.class-card-dots { display: flex; gap: 3px; margin-bottom: 8px; }
.class-dot { width: 5px; height: 5px; border-radius: 50%; }
.spec-chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.add-class-section { margin-top: 8px; }
.add-class-trigger {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px dashed var(--border);
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font-ui);
  font-size: 0.85rem;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.add-class-trigger:hover { border-color: var(--keystone); color: var(--keystone); }
.add-class-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.add-class-chip {
  padding: 5px 10px;
  border-radius: 6px;
  background: var(--bg-raised);
  border: 1px solid var(--border);
  font-family: var(--font-ui);
  font-size: 0.85rem;
  cursor: pointer;
  transition: border-color 0.15s;
}
.add-class-chip:hover { border-color: var(--keystone); }

/* Add-player form (reused in panel) */
.add-player-form {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.25rem;
}
.add-player-form h3 { font-family: var(--font-display); color: var(--text); font-size: 1rem; margin-bottom: 1rem; letter-spacing: 0.05em; }
.form-group { margin-bottom: 0.9rem; }
.form-group label { display: block; font-size: 0.82rem; color: var(--text-dim); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--font-mono); }
.form-group input[type="text"] {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 0.95rem;
  padding: 0.55rem 0.8rem;
  width: 100%;
  max-width: 300px;
}
.form-group input[type="text"]:focus { outline: none; border-color: var(--keystone-dim); }
.class-checkboxes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 0.3rem;
}
.class-check-label {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  cursor: pointer;
  font-size: 0.85rem;
  padding: 0.2rem 0.3rem;
  border-radius: 4px;
  transition: background 0.1s;
}
.class-check-label:hover { background: rgba(255,255,255,0.04); }
.class-check-label input[type="checkbox"] { accent-color: var(--keystone); flex-shrink: 0; }

.save-indicator {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: #1a4d2a;
  border: 1px solid #2a8a4d;
  color: #80e0a0;
  padding: 0.5rem 1rem;
  border-radius: 6px;
  font-size: 0.85rem;
  animation: fade-in-out 2s ease forwards;
  z-index: 50;
}
@keyframes fade-in-out {
  0%   { opacity: 0; transform: translateY(6px); }
  15%  { opacity: 1; transform: translateY(0); }
  75%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ---- CHRONICLE (HISTORY VIEW) ---- */

/* Hero stats row */
.hero-stats-row {
  display: flex;
  gap: 10px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.hero-stat-card {
  flex: 1 1 140px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 22px;
}
.hero-stat-label {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-mute);
  letter-spacing: 0.2em;
  margin-bottom: 6px;
}
.hero-stat-value {
  font-family: var(--font-display);
  font-size: 2.1rem;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 3px;
}
.hero-stat-caption {
  font-size: 0.8rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
}

/* Two-column body */
.chronicle-body {
  display: flex;
  gap: 20px;
  align-items: flex-start;
}
.chronicle-left  { flex: 1 1 300px; min-width: 0; }
.chronicle-right { flex: 1 1 260px; min-width: 0; }
.chronicle-col-label {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-mute);
  letter-spacing: 0.18em;
  margin-bottom: 12px;
}

/* Stacked role bar cards */
.role-dist-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 6px;
}
.role-dist-player { min-width: 60px; flex-shrink: 0; }
.role-dist-name   { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stacked-bar-wrap { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.stacked-bar {
  height: 14px;
  border-radius: 3px;
  overflow: hidden;
  display: flex;
}
.stacked-bar__seg { height: 100%; transition: width 0.5s ease; }
.role-dist-counts {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-dim);
  white-space: nowrap;
  min-width: 72px;
  text-align: right;
}

/* Dungeon distribution */
.dung-dist-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
}
.dung-code-pill {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(168,107,255,0.12);
  border: 1px solid var(--keystone-dim);
  color: var(--keystone);
  letter-spacing: 0.05em;
  flex-shrink: 0;
  min-width: 34px;
  text-align: center;
}
.dung-dist-name {
  font-size: 0.85rem;
  color: var(--text-dim);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dung-bar-track {
  width: 70px;
  height: 6px;
  background: var(--bg-raised);
  border-radius: 3px;
  overflow: hidden;
  flex-shrink: 0;
}
.dung-bar-fill {
  height: 100%;
  background: var(--keystone);
  border-radius: 3px;
  transition: width 0.5s ease;
}
.dung-dist-count {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-dim);
  min-width: 18px;
  text-align: right;
}

/* Recent roll list */
.roll-list  { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.25rem; }
.roll-entry {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.9rem 1rem;
}
.roll-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.6rem;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.roll-date    { color: var(--text-dim); font-size: 0.82rem; }
.roll-dungeon { color: var(--keystone); font-weight: 600; font-size: 0.95rem; }
.roll-assignments { display: flex; flex-direction: column; gap: 0.3rem; }
.roll-assign  { display: flex; align-items: center; gap: 0.6rem; font-size: 0.85rem; }
.roll-spec    { color: var(--text-dim); }

/* ---- SUBMIT BUTTON ---- */
#pw-submit {
  background: linear-gradient(135deg, var(--keystone), var(--keystone-dim));
  color: #fff;
  border: none;
  padding: 0.75rem 1.5rem;
  font-family: var(--font-display);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
  transition: box-shadow 0.15s;
  box-shadow: 0 0 18px var(--keystone-glow);
}
#pw-submit:hover { box-shadow: 0 0 28px rgba(168,107,255,0.5); }

/* ---- SPEC GROUPS (SETUP) ---- */
.spec-groups {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  align-items: flex-start;
}
.spec-group { min-width: 135px; }
.spec-group-name {
  font-size: 0.82rem;
  font-weight: 600;
  margin-bottom: 0.25rem;
  padding-bottom: 0.2rem;
  border-bottom: 1px solid var(--border);
}
.spec-check-label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
  font-size: 0.8rem;
  padding: 0.1rem 0 0.1rem 0.2rem;
  border-radius: 3px;
  opacity: 0.45;
  transition: opacity 0.1s;
}
.spec-check-label:hover { opacity: 0.75; }
.spec-check-label:has(input:checked) { opacity: 1; }
.spec-check-label input[type="checkbox"] { accent-color: var(--gold); flex-shrink: 0; }
.spec-label-text { display: flex; flex-direction: column; gap: 0.05rem; }
.spec-role-tag { font-size: 0.65rem; }
.card-banned {
  width: 100%;
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-top: 0.3rem;
}

/* ---- LARGE SCREENS ---- */
@media (min-width: 2200px) { .view-content { max-width: 1900px; } }
@media (min-width: 2560px) { .view-content { max-width: 2100px; } }

/* ---- FOCUS RING ---- */
:focus-visible { outline: 2px solid var(--keystone); outline-offset: 3px; }

/* ---- ACTIVE COUNT WARNING ---- */
@keyframes flash-warn {
  0%, 100% { color: var(--text-dim); }
  30%      { color: #e07070; }
}
.active-count-warn { animation: flash-warn 0.5s ease; }

/* mobile: chronicle body stacks */

/* ---- ZERO 2 HERO ---- */
@keyframes z2h-card-settle {
  0%   { transform: scale(1.07); }
  60%  { transform: scale(0.97); }
  100% { transform: scale(1); }
}
.z2h-card--settling { animation: z2h-card-settle 0.5s ease; }

.z2h-player-pick { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; justify-content: center; }
.z2h-player-chip {
  padding: 8px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  cursor: pointer;
  font-size: 0.9rem;
  color: var(--text);
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}

// ==================== UTILITIES ====================

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function genId() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function classColor(cls) {
  return CLASS_COLORS[cls] || '#cccccc';
}

function roleBadge(role, size) {
  const cls   = role === 'TANK' ? 'role-badge--tank' : role === 'HEAL' ? 'role-badge--heal' : 'role-badge--dps';
  const glyph = ROLE_GLYPHS[role] || '';
  const label = ROLE_LABELS[role] || role;
  const szCls = size === 'sm' ? ' sm' : size === 'lg' ? ' lg' : '';
  return `<span class="role-badge ${cls}${szCls}">${glyph} ${esc(label)}</span>`;
}

function keystoneShard(size, level, color) {
  const c  = color || '#a86bff';
  const id = 'ks' + Math.random().toString(36).slice(2, 7);
  const glowSize = Math.round(size / 4);

    ? `<text x="30" y="37" text-anchor="middle" fill="white"

         style="text-shadow:0 0 6px rgba(0,0,0,0.6)">+${esc(String(level))}</text>`

  return `<svg width="${size}" height="${size}" viewBox="0 0 60 60"
    style="display:inline-block;vertical-align:middle;filter:drop-shadow(0 0 ${glowSize}px ${c}aa)"
    aria-hidden="true">
    <defs>
      <linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${c}" stop-opacity="1"/>

             fill="none" stroke="${c}" stroke-width="0.8" opacity="0.6"/>

  </svg>`;
}

}

function computeComp(assignments) {
  let interrupts = 0, lust = null, melee = 0, ranged = 0;
  const brezProviders = [];
  for (const a of assignments) {
    const key = `${a.class}/${a.spec}`;
    if (!NO_INTERRUPT_SPECS.has(key))   interrupts++;
    if (LUST_CLASSES.has(a.class) && !lust) lust = a.class;
    if (BREZ_CLASSES.has(a.class))      brezProviders.push(a.class);
    if (MELEE_SPECS.has(key)) melee++; else ranged++;
  }
  return { interrupts, lust, brez: brezProviders, melee, ranged };
}

async function apiRequest(method, body) {
  const opts = {
    method,
    headers: {
      'Content-Type': 'application/json',
      'X-Group-Password': sessionPw,
    },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  return fetch(API_URL, opts);
}

async function loadState() {
  const res = await apiRequest('GET');
  if (!res.ok) {
    const err = Object.assign(new Error('Load failed'), { status: res.status });
    throw err;
  }
  appState = await res.json();
  migratePlayers(appState);
}

async function saveState() {
  const res = await apiRequest('PUT', appState);
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    throw new Error(data.error || `Save failed (${res.status})`);
  }
  appState = await res.json();
}

// ==================== AUDIO ====================

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playClick() {
  if (muted) return;
  try {
    const ctx  = getCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.value = 800 + Math.random() * 400;
    gain.gain.setValueAtTime(0.05, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.start(); osc.stop(ctx.currentTime + 0.05);
  } catch {}
}

function playSettle() {
  if (muted) return;
  try {
    const ctx  = getCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(783.99, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  } catch {}
}

function playFanfare() {
  if (muted) return;
  try {
    const ctx   = getCtx();
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    notes.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.start(t); osc.stop(t + 0.12);
    });
  } catch {}
}

// ==================== RANDOMIZE ALGORITHM ====================

function computeAssignments(playerIds) {
  const roles       = shuffle(['TANK', 'HEAL', 'DPS', 'DPS', 'DPS']);
  const shuffledIds = shuffle([...playerIds]);
  const assignments = [];
  const errors      = [];

  for (let i = 0; i < 5; i++) {
    const player = appState.players.find(p => p.id === shuffledIds[i]);
    const role   = roles[i];

    const eligClasses = Object.keys(player.specs || {}).filter(cls => {
      if (!CLASSES[cls]) return false;
      return (player.specs[cls] || []).some(spec => {
        const s = CLASSES[cls].find(s2 => s2.spec === spec);
        return s && s.role === role;
      });
    });

    if (eligClasses.length === 0) {
      errors.push({ player, role });
      continue;
    }

    const chosenClass  = pick(eligClasses);
    const eligSpecs    = (player.specs[chosenClass] || []).filter(spec => {
      const s = CLASSES[chosenClass].find(s2 => s2.spec === spec);
      return s && s.role === role;
    });
    const chosenSpec   = pick(eligSpecs);

    assignments.push({
      playerId:   player.id,
      playerName: player.name,
      role,
      class:      chosenClass,
      spec:       chosenSpec,
    });
  }

  return { assignments, errors };
}

// ==================== RENDER ====================

const PHASE_LABELS = {
  'idle':      'GATHERING',
  'revealing': 'THE ROLL',
  'key-entry': 'KEYSTONES',
  'done':      "TONIGHT'S PATH",
};

function updateSeasonPill() {
  const el = document.getElementById('season-pill');
  if (!el) return;
  el.textContent = '';
  el.style.display = 'none';
}

function render() {
  if (activeView === 'randomize') renderRandomize();
  else if (activeView === 'setup')    renderSetup();
  else if (activeView === 'history')  renderHistory();
  else if (activeView === 'z2h')      renderZ2H();
  updateSeasonPill();
}

function showView(view) {
  activeView = view;
  if (view !== 'setup') {
    clearTimeout(removeConfirmTimer);
    removeConfirmId  = null;
    setupAddingClass = false;
  }
  document.querySelectorAll('.tab').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.view === view)
  );
  render();
}

// ---------- RANDOMIZE VIEW ----------

function phaseProgressBar() {
  const phases = [
    { id: 'idle',      label: 'GATHERING' },
    { id: 'revealing', label: 'THE ROLL' },
    { id: 'key-entry', label: 'KEYSTONES' },
    { id: 'done',      label: "TONIGHT'S PATH" },
  ];
  const cur = phases.findIndex(p => p.id === rPhase);
  let h = '<div class="phase-progress">';
  for (let i = 0; i < phases.length; i++) {
    const cls = i === cur ? 'phase-step--active' : i < cur ? 'phase-step--done' : '';
    h += `<div class="phase-step ${cls}"><div class="phase-dot"></div>${phases[i].label}</div>`;
    if (i < phases.length - 1) h += '<div class="phase-divider"></div>';
  }
  h += '</div>';
  return h;
}

function renderRandomize() {
  const main    = document.getElementById('main');
  const players = appState.players;
  const enough  = players.length >= 5;
  let h = '<div class="view-content">';
  h += phaseProgressBar();

  // Section: gathering (idle phase)
  if (rPhase === 'idle') {
    const canRoll = activePlayers.size === 5;
    const activeArr = [...activePlayers];

    if (!enough) {
      h += `<section class="section"><p class="notice">You need at least 5 players in your roster. <button class="link-btn" onclick="showView('setup')">Go to Roster →</button></p></section>`;
    } else {
      h += '<section class="section">';

      // Ritual slots
      h += '<div class="ritual-slots-row">';
      for (let i = 0; i < 5; i++) {
        const pid = activeArr[i];
        const p   = pid ? players.find(pl => pl.id === pid) : null;
        if (p) {
          const clsList = Object.keys(p.specs || {});
          h += `<div class="ritual-slot ritual-slot--filled">
            ${playerAvatar(28, p.name, clsList[0] || '')}
            <div class="ritual-slot__name">${esc(p.name)}</div>
          </div>`;
        } else {
          h += '<div class="ritual-slot"><div class="ritual-slot__q">?</div></div>';
        }
      }
      h += '</div>';

      // Roster label
      h += '<div class="gather-label">ROSTER</div>';

      // Class pills (one per player — toggles selection)
      h += '<div class="class-pills-row">';
      for (const p of players) {
        const on      = activePlayers.has(p.id);
        const clsList = Object.keys(p.specs || {});
        const color   = clsList.length > 0 ? classColor(clsList[0]) : 'var(--text-dim)';
        const classCap = clsList.join(' · ');
        const pillStyle = on ? `--class-color:${color};box-shadow:0 0 8px ${color}44;` : '';
        h += `<button class="class-pill${on ? ' class-pill--on' : ''}"
          style="${pillStyle}"
          onclick="togglePlayer('${esc(p.id)}')">
          ${playerAvatar(28, p.name, clsList[0] || '')}
          <span>
            <span class="class-pill__name">${esc(p.name)}</span>
            <span class="class-pill__classes" style="color:${on ? color : 'var(--text-mute)'}">${esc(classCap || 'No class')}</span>
          </span>
        </button>`;
      }
      h += '</div>';

      // Role pool readout
      let poolTank = 0, poolHeal = 0, poolDps = 0;
      for (const pid of activePlayers) {
        const pp = players.find(pl => pl.id === pid);
        if (!pp) continue;
        let hasTank = false, hasHeal = false, hasDps = false;
        for (const [cls, specs] of Object.entries(pp.specs || {})) {
          for (const spec of specs) {
            const s = (CLASSES[cls] || []).find(s2 => s2.spec === spec);
            if (!s) continue;
            if (s.role === 'TANK') hasTank = true;
            else if (s.role === 'HEAL') hasHeal = true;
            else if (s.role === 'DPS')  hasDps  = true;
          }
        }
        if (hasTank) poolTank++;
        if (hasHeal) poolHeal++;
        if (hasDps)  poolDps++;
      }
      if (activePlayers.size > 0) {
        h += `<div class="role-pool-row">
          <span class="role-pool-label">POOL</span>
          ${roleBadge('TANK','sm')} <span>${poolTank} can tank</span>
          ${roleBadge('HEAL','sm')} <span>${poolHeal} can heal</span>
          ${roleBadge('DPS', 'sm')} <span>${poolDps} can DPS</span>
        </div>`;
      }

      // Cast button
      const need = 5 - activePlayers.size;
      const hint = activePlayers.size === 0
        ? 'CHOOSE 5 TO BEGIN'
        : need === 1 ? '1 MORE TO CHOOSE' : `${need} MORE TO CHOOSE`;
      h += `<div class="center">
        <button class="action-primary" ${canRoll ? '' : 'disabled'} onclick="handleRandomize()">◇ CAST THE LOTS ◇</button>
        ${!canRoll ? `<div class="cast-hint">${hint}</div>` : ''}
      </div>`;
      h += '</section>';
    }
  }

  // Section: reveal cards (only while revealing)
  if (rPhase === 'revealing') {
    h += '<section class="section" id="slots-section">';
    h += `<div class="slot-reveal-header">
      <span></span>
      <button class="skip-btn" id="skip-btn-el" onclick="skipReveal=true">SKIP ▸▸</button>
    </div>`;
    h += '<div class="slot-cards" role="status" aria-live="polite">';
    for (let i = 0; i < rAssignments.length; i++) {
      const a = rAssignments[i];
      h += `<div class="slot-card" id="slot-card-${i}">
        <div class="slot-card-role">${roleBadge(a.role)}</div>
        <div class="slot-portrait" id="slot-portrait-${i}">
          <span class="slot-cycle-name" id="slot-player-${i}">???</span>
        </div>
        <div class="slot-name-area" id="slot-name-${i}"><span class="slot-dots">· · ·</span></div>
        <div class="slot-spec-line" id="slot-detail-${i}"></div>
      </div>`;
    }
    h += '</div>';
    h += '<div class="progress-line" id="reveal-progress">0 OF 5 BOUND · 5 STILL WRITHING</div>';
    h += '<div class="center" style="margin-top:32px">';
    h += `<button class="action-primary" id="advance-btn-el" disabled onclick="advanceToKeystones()">◆ ENTER THE KEYSTONE PHASE ◆</button>`;
    h += '</div>';
    h += '</section>';
  }

  // Section: keystones (key entry)
  if (rPhase === 'key-entry') {
    h += '<section class="section" id="key-section">';
    h += '<div class="keystones-layout">';

    // ---- Left column: player rows ----
    h += '<div class="keystones-left">';
    h += '<div class="key-player-rows">';
    for (const a of rAssignments) {
      const ki       = rKeyInputs[a.playerId] || { dungeon: null, level: 10 };
      const hasDungeon = ki.dungeon != null;
      const cc = classColor(a.class);
      h += `<div class="key-player-row${hasDungeon ? ' has-key' : ''}" style="${hasDungeon ? 'border-left-color:'+cc+';' : ''}">`;

      // Top row: avatar + name/spec + level widget
      h += '<div class="key-player-top">';
      h += playerAvatar(36, a.playerName, a.class);
      h += `<div class="key-player-info">
        <span class="key-player-name-text" style="color:${cc}">${esc(a.playerName)}</span>
        <span class="key-player-spec-line">${esc(a.spec)} · ${esc(a.class)}</span>
      </div>`;
      // Level widget (right side of top row)
      h += '<div class="key-level-area">';
      if (hasDungeon) {
        const lvl = ki.level || 8;
        h += `<button class="key-level-btn" onclick="setPlayerLevel('${esc(a.playerId)}',-1)">−</button>`;
        h += keystoneShard(36, lvl, '#a86bff');
        h += `<button class="key-level-btn" onclick="setPlayerLevel('${esc(a.playerId)}',1)">+</button>`;
      } else {
        h += '<span class="no-key-label">NO KEY</span>';
      }
      h += '</div>';
      h += '</div>'; // key-player-top

      // Dungeon code chips — full-width row
      h += '<div class="key-dungeons">';
      for (const [dName, dCode] of Object.entries(DUNGEON_CODES)) {
        const sel = ki.dungeon === dName;
        h += `<button class="dungeon-code${sel ? ' dungeon-code--selected' : ''}"
          data-dungeon="${esc(dName)}"
          onclick="setPlayerDungeon('${esc(a.playerId)}', this.dataset.dungeon)">${esc(dCode)}</button>`;
      }
      h += '</div>';

      h += '</div>'; // key-player-row
    }
    h += '</div>'; // key-player-rows
    h += `<p class="key-tip">Tip — Click a dungeon code, set the key level. If nobody has a key, we'll roll from the full season pool.</p>`;
    h += '</div>'; // keystones-left

    // ---- Right column: odds preview ----
    h += '<div class="keystones-right"><div class="odds-panel">';
    h += '<div class="odds-header-label">ODDS PREVIEW</div>';

    const keyed  = rAssignments.filter(a => rKeyInputs[a.playerId]?.dungeon);
    const keyCount = keyed.length;
    h += `<div class="odds-count">${keyCount} <span class="odds-count-dim">/ 5 keys</span></div>`;

    if (keyCount > 0) {
      const tallied = {};
      for (const a of keyed) tallied[rKeyInputs[a.playerId].dungeon] = (tallied[rKeyInputs[a.playerId].dungeon] || 0) + 1;
      const sorted = Object.entries(tallied).sort((a, b) => b[1] - a[1]);
      h += '<div class="odds-dungeon-list">';
      for (const [dname, cnt] of sorted) {
        const pct = Math.round((cnt / keyCount) * 100);
        h += `<div class="odds-dungeon-row">
          <div class="odds-dungeon-meta">
            <span class="odds-dungeon-name">${esc(dname)}</span>
            <span class="odds-dungeon-pct">${pct}%</span>
          </div>
          <div class="odds-bar-track"><div class="odds-bar-fill" style="width:${pct}%"></div></div>
        </div>`;
      }
      h += '</div>';
    } else {
      h += '<span class="odds-empty">Full season pool</span>';
    }

    h += '</div></div>'; // odds-panel + keystones-right

    h += '</div>'; // keystones-layout
    h += '<div class="center" style="margin-top:32px">';
    h += `<button class="action-primary" onclick="handleRollKey()">◆ ROLL THE KEY ◆</button>`;
    h += '</div>';
    h += '</section>';
  }

  // Section: final result (Tonight's Path)
  if (rPhase === 'done') {
    const comp = computeComp(rAssignments);
    h += '<section class="section" id="final-section">';
    h += '<div class="final-layout">';

    // ---- Left: dungeon card ----
    h += '<div class="final-dungeon-card">';
    const dungeonImg = DUNGEON_IMAGES[rDungeon];
    if (dungeonImg) {
      h += `<div class="dungeon-art" id="dungeon-art-el"><img src="${dungeonImg}" alt="${esc(rDungeon)}" loading="lazy"></div>`;
    } else {
      h += '<div class="dungeon-art-placeholder" id="dungeon-art-el"></div>';
    }
    h += '<div class="dungeon-card-body">';
    h += '<div class="dungeon-reveal-row">';
    h += keystoneShard(72, rKeyLevel, '#ffc94d');
    h += `<div class="dungeon-name" id="dungeon-name-display">${esc(rDungeon)}</div>`;
    h += '</div>'; // dungeon-reveal-row
    h += '<div class="dungeon-bottom-strip">';
    if (rKeyHolder) {
      const holderAssign = rAssignments.find(a => a.playerName === rKeyHolder);
      h += '<div class="key-holder-line">';
      if (holderAssign) h += playerAvatar(22, rKeyHolder, holderAssign.class);
      h += `<span>${esc(rKeyHolder)}'s key</span>`;
      h += '</div>';
    }
    const affixes = affixesForLevel(rKeyLevel);
    if (affixes.length) {
      h += '<div class="affix-tags">';
      for (const affix of affixes) {
        h += `<span class="affix-tag">${esc(affix.toUpperCase())}</span>`;
      }
      h += '</div>';
    }
    h += '</div>'; // dungeon-bottom-strip
    h += '</div>'; // dungeon-card-body
    h += '</div>'; // final-dungeon-card

    // ---- Right: party composition ----
    h += '<div class="final-party">';
    h += '<div class="final-party-label">YOUR PARTY</div>';
    for (const a of rAssignments) {
      const cc = classColor(a.class);
      h += `<div class="final-party-row" style="border-left-color:${cc}">`;
      h += roleBadge(a.role, 'sm');
      h += playerAvatar(28, a.playerName, a.class);
      h += `<div class="final-party-info">
        <span class="final-party-name" style="color:${cc}">${esc(a.playerName)}</span>
        <span class="final-party-spec">${esc(a.spec)} ${esc(a.class)}</span>
      </div>`;
      h += '</div>';
    }
    h += '</div>'; // final-party

    h += '</div>'; // final-layout

    // ---- Comp readout (stat tiles) ----
    const brezHtml = comp.brez.length
      ? comp.brez.map(c => `<span style="color:${CLASS_COLORS[c] || '#ccc'}">${esc(c)}</span>`).join(', ')
      : 'none';
    h += '<div class="hero-stats-row" style="margin-bottom:8px">';
    h += `<div class="hero-stat-card">
      <div class="hero-stat-label">INTERRUPTS</div>
      <div class="hero-stat-value">${comp.interrupts}</div>
    </div>`;
    h += `<div class="hero-stat-card">
      <div class="hero-stat-label">LUST</div>
      <div class="hero-stat-value" style="font-size:1.2rem;color:${comp.lust ? (CLASS_COLORS[comp.lust] || '#ccc') : 'var(--danger)'}">${comp.lust ? esc(comp.lust) : 'none'}</div>
    </div>`;
    h += `<div class="hero-stat-card">
      <div class="hero-stat-label">BATTLE REZ</div>
      <div class="hero-stat-value" style="font-size:1.2rem${comp.brez.length ? '' : ';color:var(--danger)'}">${brezHtml}</div>
    </div>`;
    h += `<div class="hero-stat-card">
      <div class="hero-stat-label">MELEE / RANGED</div>
      <div class="hero-stat-value">${comp.melee}<span style="color:var(--text-mute);font-size:1.2rem"> / </span>${comp.ranged}</div>
    </div>`;
    h += '</div>';

    // ---- Action buttons ----
    h += '<div class="center" style="margin-top:24px">';
    h += `<button class="action-primary" onclick="resetRandomize()">◇ NEW SESSION</button>`;
    h += '</div>';
    h += '<div class="final-actions">';
    h += `<button class="btn-secondary" id="copy-result-btn" onclick="copyResult()">📋 COPY TO DISCORD</button>`;
    h += '</div>';

    h += '</section>';
  }

  h += '</div>';
  main.innerHTML = h;
}

function renderSetup() {
  const main    = document.getElementById('main');
  const players = appState.players;

  let rail = '';
  for (const p of players) {
    const clsList  = Object.keys(p.specs || {});
    const isSelected = setupSelectedPlayerId === p.id;
    const color    = clsList.length > 0 ? classColor(clsList[0]) : 'var(--text-dim)';
    const selStyle = isSelected
      ? `background:${color}15;border-color:${color};border-left-color:${color};`
      : '';
    rail += `<div class="roster-player-row" onclick="selectSetupPlayer('${esc(p.id)}')" style="${selStyle}">
      ${playerAvatar(28, p.name, clsList[0] || '')}
      <div class="roster-player-meta">
        <div class="roster-player-name" style="color:${isSelected ? color : 'var(--text)'}">${esc(p.name)}</div>
        <div class="roster-player-classes">${clsList.length} CLASS${clsList.length !== 1 ? 'ES' : ''}</div>
      </div>
      ${isSelected ? '<div class="roster-player-chevron">›</div>' : ''}
    </div>`;
  }
  if (players.length < 15) {
    const isAdd = setupSelectedPlayerId === '__add__';
    rail += `<button class="roster-add-btn" onclick="selectSetupPlayer('__add__')"
      style="${isAdd ? 'border-color:var(--keystone);color:var(--keystone);' : ''}">
      + Add Player
    </button>`;
  } else {
    rail += '<p class="notice" style="font-size:0.8rem;margin-top:6px;">Roster full (15 max)</p>';
  }

  let panel = '';
  if (!setupSelectedPlayerId) {
    panel = '<div class="roster-panel-empty">SELECT A PLAYER TO EDIT</div>';
  } else if (setupSelectedPlayerId === '__add__') {
    panel = addPlayerFormHtml();
  } else {
    const p = players.find(pl => pl.id === setupSelectedPlayerId);
    if (p) panel = rosterPanelHtml(p);
    else   panel = '<div class="roster-panel-empty">PLAYER NOT FOUND</div>';
  }

  const h = `<div class="view-content">
    <div class="roster-layout">
      <div class="roster-rail">${rail}</div>
      <div class="roster-panel">${panel}</div>
    </div>
  </div>`;
  main.innerHTML = h;
}

function rosterPanelHtml(p) {
  const id       = esc(p.id);
  const clsList  = Object.keys(p.specs || {});
  const allSpecs = clsList.reduce((n, c) => n + ((p.specs[c] || []).length), 0);
  const color    = clsList.length > 0 ? classColor(clsList[0]) : 'var(--text-dim)';
  const removeLbl = removeConfirmId === p.id ? 'Confirm remove?' : 'Remove';

  let classCards = '';
  for (const cls of clsList) {
    const cc       = classColor(cls);
    const enabled  = p.specs[cls] || [];
    const allCls   = CLASSES[cls] || [];
    const dots     = allCls.map(s =>
      `<div class="class-dot" style="background:${enabled.includes(s.spec) ? cc : 'var(--text-mute)'}"></div>`
    ).join('');
    const chips    = allCls.map(s => {
      const on   = enabled.includes(s.spec);
      const rc   = ROLE_COLORS[s.role] || 'var(--text-dim)';
      const dot  = `<span class="spec-chip__dot" style="${on ? '--role-color:'+rc : ''}"></span>`;
      const role = `<span class="spec-chip__role" style="color:${rc}">${esc(ROLE_LABELS[s.role] || s.role)}</span>`;
      return `<button class="spec-chip${on ? ' spec-chip--on' : ''}"
        style="${on ? '--role-color:'+rc+';border-color:'+rc+'40' : ''}"
        onclick="toggleSpec('${id}','${esc(cls)}','${esc(s.spec)}')">${dot}${esc(s.spec)}${role}</button>`;
    }).join('');
    classCards += `<div class="class-card" style="border-left-color:${cc}">
      <div class="class-card-header">
        <span class="class-card-name" style="color:${cc}">${esc(cls)}</span>
        <div class="class-card-right">
          <span class="class-card-counter">${enabled.length} / ${allCls.length}</span>
        </div>
      </div>
      <div class="class-card-dots">${dots}</div>
      <div class="spec-chips-row">${chips}</div>
    </div>`;
  }

  const addableClasses = Object.keys(CLASSES).filter(c => !clsList.includes(c));
  let addSection = '';
  if (addableClasses.length > 0) {
    if (setupAddingClass) {
      const chips = addableClasses.map(c =>
        `<button class="add-class-chip" style="color:${classColor(c)}"
          onclick="addClassToPlayer('${id}','${esc(c)}')">${esc(c)}</button>`
      ).join('');
      addSection = `<div class="add-class-section">
        <div class="add-class-picker">${chips}</div>
      </div>`;
    } else {
      addSection = `<div class="add-class-section">
        <button class="add-class-trigger" onclick="setupAddingClass=true;renderSetup()">
          + Add a class ${esc(p.name)} plays
        </button>
      </div>`;
    }
  }

  return `<div>
    <div class="roster-panel-header">
      ${playerAvatar(48, p.name, clsList[0] || '')}
      <div class="roster-panel-meta">
        <div class="roster-name-row">
          <input class="roster-panel-name-input" id="roster-name-${id}" type="text"
            value="${esc(p.name)}" maxlength="30"
            onblur="handleSavePlayerName('${id}')"
            onkeydown="if(event.key==='Enter')this.blur()" />
        </div>
        <div class="roster-panel-spec-count">${allSpecs} SPEC${allSpecs !== 1 ? 'S' : ''} ENABLED</div>
      </div>
      <button class="btn small danger" id="remove-btn-${id}"
        onclick="handleRemovePlayer('${id}')">${removeLbl}</button>
    </div>
    ${classCards}
    ${addSection}
  </div>`;
}

function addPlayerFormHtml() {
  return `<div class="add-player-form" id="add-form">
    <h3>Add Player</h3>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="new-name" maxlength="30" placeholder="Player name" autofocus />
    </div>
    <div class="form-group">
      <label>Specs</label>
      <div class="spec-groups">
        ${Object.keys(CLASSES).map(cls =>
          `<div class="spec-group">
             <label class="class-check-label" style="color:${classColor(cls)};font-weight:600;font-size:0.82rem;border-bottom:1px solid var(--border);padding-bottom:0.2rem;margin-bottom:0.15rem">

                  <input type="checkbox" class="new-spec" data-class="${esc(cls)}" value="${esc(s.spec)}">
                  <span class="spec-label-text">
                    <span style="color:${classColor(cls)}">${esc(s.spec)}</span>
                    <span class="spec-role-tag" style="color:${ROLE_COLORS[s.role]}">${esc(ROLE_LABELS[s.role])}</span>
                  </span>
                </label>`
             ).join('')}
           </div>`

      </div>
    </div>
    <div class="form-error" id="add-err" hidden></div>
    <div class="center" style="margin-top:1.25rem"><button class="action-primary" onclick="handleAddPlayer()">Add Player</button></div>
  </div>`;
}
